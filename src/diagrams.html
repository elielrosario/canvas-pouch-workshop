<!--
  Step diagrams. build.py puts everything before the first <figure> at the top
  of the page, and drops each <figure data-step="N"> into step N, just above
  its Done button. Colors come only from the site's theme tokens, so every
  drawing flips with light/dark.
  Orange (primary) = what you do in this step: marks, stitching, tape.
-->
<style>
.dg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.step-fig { margin: 0; max-width: 360px; padding: var(--space--sm); background: var(--color--surface); border: 1px solid var(--color--border); border-radius: var(--radius--md); }
.step-fig svg { display: block; width: 100%; height: auto; }
.step-fig text { font-family: var(--type--family-mono); font-size: 11px; fill: var(--color--text-mu); }
.step-fig text.dg-strong { font-family: var(--type--family-sans); font-size: 12px; font-weight: 600; fill: var(--color--text); }
.dg-canvas { fill: color-mix(in srgb, var(--color--primary) 10%, var(--color--surface)); stroke: var(--color--text-mu); stroke-width: 1.5; }
.dg-paper { fill: var(--color--surface); stroke: var(--color--text); stroke-width: 1.5; }
.dg-plate { fill: var(--color--surface-alt); stroke: var(--color--border); stroke-width: 1.5; }
.dg-tape { fill: var(--color--neutral-800); }
.dg-tape-back { fill: var(--color--neutral-200); stroke: var(--color--neutral-500); stroke-width: 1; stroke-dasharray: 3 2; }
.dg-teeth { fill: none; stroke: var(--color--neutral-400); stroke-width: 7; stroke-dasharray: 2 2; }
.dg-teeth-back { fill: none; stroke: var(--color--neutral-500); stroke-width: 1; stroke-dasharray: 2 3; }
.dg-pull { fill: var(--color--neutral-500); stroke: var(--color--neutral-800); stroke-width: 1; }
.dg-pull-back { fill: none; stroke: var(--color--neutral-500); stroke-width: 1.2; stroke-dasharray: 2 2; }
.dg-act { fill: none; stroke: var(--color--primary); stroke-width: 2.5; stroke-linecap: round; }
.dg-stitch { fill: none; stroke: var(--color--primary); stroke-width: 2; stroke-dasharray: 5 4; }
.dg-basting { fill: color-mix(in srgb, var(--color--primary) 55%, transparent); }
.dg-zig { fill: none; stroke: var(--color--primary); stroke-width: 1.5; }
.dg-line { fill: none; stroke: var(--color--text-mu); stroke-width: 1.2; }
.dg-mark-old { fill: none; stroke: var(--color--text-mu); stroke-width: 2.5; stroke-linecap: round; }
.dg-edge { fill: none; stroke: var(--color--text); stroke-width: 2; }
.dg-arrow { fill: none; stroke: var(--color--text); stroke-width: 1.5; marker-end: url(#dg-head); }
.dg-head { fill: var(--color--text); }
.dg-foot { fill: none; stroke: var(--color--text); stroke-width: 1.5; }
.dg-needle { fill: var(--color--text); }
.dg-pencil { fill: var(--color--text-mu); }
.dg-pencil-tip { fill: var(--color--text); }
.dg-xs-canvas { fill: none; stroke: var(--color--neutral-400); stroke-width: 6; }
.dg-xs-tape { fill: none; stroke: var(--color--neutral-800); stroke-width: 3; }
.dg-xs-teeth { fill: var(--color--neutral-500); }
</style>
<svg class="dg-defs" aria-hidden="true" focusable="false">
  <defs>
    <marker id="dg-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-head" d="M0 0 L10 5 L0 10 Z"></path>
    </marker>
    <pattern id="dg-overlock-v" width="8" height="6" patternUnits="userSpaceOnUse">
      <path class="dg-zig" d="M0 0 L8 3 L0 6"></path>
    </pattern>
    <pattern id="dg-overlock-h" width="6" height="8" patternUnits="userSpaceOnUse">
      <path class="dg-zig" d="M0 0 L3 8 L6 0"></path>
    </pattern>
  </defs>
</svg>

<figure class="step-fig" data-step="1">
  <svg viewBox="0 0 320 200" role="img" aria-label="A paper pattern laid on the canvas, with its outline being traced in pencil.">
    <rect class="dg-canvas" x="16" y="16" width="288" height="168" rx="2"></rect>
    <text x="28" y="36">Canvas</text>
    <rect class="dg-paper" x="104" y="34" width="112" height="140"></rect>
    <text class="dg-strong" x="160" y="108" text-anchor="middle">Pattern</text>
    <path class="dg-act" d="M104 34 V174 H176"></path>
    <g transform="translate(176 174) rotate(-40)">
      <rect class="dg-pencil" x="0" y="-4" width="46" height="8"></rect>
      <path class="dg-pencil-tip" d="M0 -4 L-9 0 L0 4 Z"></path>
    </g>
  </svg>
</figure>

<figure class="step-fig" data-step="3">
  <svg viewBox="0 0 320 200" role="img" aria-label="The cut canvas with a serged zigzag finish along all four edges.">
    <rect class="dg-canvas" x="100" y="20" width="120" height="160"></rect>
    <rect x="96" y="20" width="8" height="160" fill="url(#dg-overlock-v)"></rect>
    <rect x="216" y="20" width="8" height="160" fill="url(#dg-overlock-v)"></rect>
    <rect x="100" y="16" width="120" height="8" fill="url(#dg-overlock-h)"></rect>
    <rect x="100" y="176" width="120" height="8" fill="url(#dg-overlock-h)"></rect>
    <path class="dg-line" d="M226 70 H248"></path>
    <text x="252" y="68">Serge all</text>
    <text x="252" y="82">4 edges</text>
  </svg>
</figure>

<figure class="step-fig" data-step="4">
  <svg viewBox="0 0 320 224" role="img" aria-label="The canvas front side up, standing tall, with the short sides at the top and bottom.">
    <rect class="dg-canvas" x="110" y="32" width="100" height="160"></rect>
    <text x="160" y="24" text-anchor="middle">Short side</text>
    <text x="160" y="210" text-anchor="middle">Short side</text>
    <text transform="translate(98 112) rotate(-90)" text-anchor="middle">Long side</text>
    <text class="dg-strong" x="160" y="108" text-anchor="middle">Front</text>
    <text class="dg-strong" x="160" y="124" text-anchor="middle">side up</text>
  </svg>
</figure>

<figure class="step-fig" data-step="5">
  <svg viewBox="0 0 320 224" role="img" aria-label="The zipper lying face down along the top edge of the canvas, with the pull at the left end.">
    <rect class="dg-canvas" x="110" y="32" width="100" height="160"></rect>
    <rect class="dg-tape-back" x="94" y="32" width="132" height="16"></rect>
    <line class="dg-teeth-back" x1="122" y1="40" x2="202" y2="40"></line>
    <rect class="dg-pull-back" x="110" y="34" width="11" height="12" rx="2"></rect>
    <path class="dg-line" d="M110 44 L66 76"></path>
    <text x="16" y="90">Pull on</text>
    <text x="16" y="104">your left</text>
    <path class="dg-line" d="M226 44 L244 70"></path>
    <text x="234" y="84">Zipper</text>
    <text x="234" y="98">face down</text>
    <text x="160" y="124" text-anchor="middle">Front side up</text>
  </svg>
</figure>

<figure class="step-fig" data-step="6">
  <svg viewBox="0 0 320 224" role="img" aria-label="Marks across the zipper tape where the zipper starts and stops, with matching marks on the canvas just below.">
    <rect class="dg-canvas" x="110" y="32" width="100" height="160"></rect>
    <rect class="dg-tape-back" x="94" y="32" width="132" height="16"></rect>
    <line class="dg-teeth-back" x1="122" y1="40" x2="202" y2="40"></line>
    <rect class="dg-pull-back" x="110" y="34" width="11" height="12" rx="2"></rect>
    <path class="dg-act" d="M122 26 V52 M202 26 V52"></path>
    <text x="122" y="18" text-anchor="middle">Start</text>
    <text x="202" y="18" text-anchor="middle">Stop</text>
    <path class="dg-act" d="M122 58 V68 M202 58 V68"></path>
    <path class="dg-line" d="M206 66 L236 92"></path>
    <text x="234" y="106">Matching</text>
    <text x="234" y="120">marks on</text>
    <text x="234" y="134">canvas</text>
  </svg>
</figure>

<figure class="step-fig" data-step="7">
  <svg viewBox="0 0 320 224" role="img" aria-label="The zipper slid down to the bottom edge of the canvas, with new marks at its start and stop. The first marks stay at the top edge.">
    <rect class="dg-canvas" x="110" y="32" width="100" height="160"></rect>
    <path class="dg-mark-old" d="M122 32 V44 M202 32 V44"></path>
    <rect class="dg-tape-back" x="94" y="176" width="132" height="16"></rect>
    <line class="dg-teeth-back" x1="122" y1="184" x2="202" y2="184"></line>
    <rect class="dg-pull-back" x="110" y="178" width="11" height="12" rx="2"></rect>
    <path class="dg-act" d="M122 158 V168 M202 158 V168 M122 172 V196 M202 172 V196"></path>
    <path class="dg-arrow" d="M86 56 V164"></path>
    <text x="16" y="106">Slide</text>
    <text x="16" y="120">down</text>
    <path class="dg-line" d="M206 162 L236 138"></path>
    <text x="236" y="132">Mark again</text>
  </svg>
</figure>

<figure class="step-fig" data-step="8">
  <svg viewBox="0 0 320 170" role="img" aria-label="The zipper flipped face up with the pull on the left, and a strip of basting tape along its top edge.">
    <rect class="dg-tape" x="24" y="64" width="272" height="44"></rect>
    <rect class="dg-basting" x="24" y="64" width="272" height="10"></rect>
    <line class="dg-teeth" x1="66" y1="88" x2="276" y2="88"></line>
    <rect class="dg-pull" x="46" y="80" width="18" height="16" rx="3"></rect>
    <rect class="dg-pull" x="28" y="84" width="20" height="8" rx="4"></rect>
    <path class="dg-line" d="M200 66 L218 40"></path>
    <text x="220" y="34">Basting tape</text>
    <path class="dg-line" d="M40 98 V130"></path>
    <text x="24" y="146">Pull on your left, facing up</text>
  </svg>
</figure>

<figure class="step-fig" data-step="10">
  <svg viewBox="0 0 320 216" role="img" aria-label="Top view of the machine: the needle sews through the canvas and zipper while the fabric edge runs along the line marked 10, to the right of the needle.">
    <rect class="dg-plate" x="12" y="12" width="296" height="176" rx="10"></rect>
    <path class="dg-line" d="M232 22 V178 M260 22 V178"></path>
    <rect class="dg-canvas" x="12" y="12" width="192" height="176"></rect>
    <path class="dg-act" d="M204 12 V188"></path>
    <text class="dg-strong" x="212" y="176">10</text>
    <path class="dg-stitch" d="M120 14 V98"></path>
    <rect class="dg-foot" x="96" y="66" width="48" height="76" rx="10"></rect>
    <circle class="dg-needle" cx="120" cy="104" r="3.5"></circle>
    <path class="dg-line" d="M124 100 L154 58"></path>
    <text x="156" y="54">Needle</text>
    <text x="24" y="178">Canvas + zipper</text>
    <text x="160" y="208" text-anchor="middle">Fabric edge on the 10 line</text>
  </svg>
</figure>

<figure class="step-fig" data-step="11">
  <svg viewBox="0 0 340 150" role="img" aria-label="Side view. Before: the zipper lies face down on the canvas, sewn near the edge. After: the zipper is folded out past the canvas edge, face up, and the fold is creased.">
    <text x="16" y="24">Before</text>
    <path class="dg-xs-canvas" d="M16 84 H150"></path>
    <rect class="dg-xs-teeth" x="100" y="74" width="10" height="8" rx="2"></rect>
    <path class="dg-xs-tape" d="M104 74 H150"></path>
    <path class="dg-act" d="M138 62 V96"></path>
    <text x="16" y="112">Canvas</text>
    <text x="60" y="56">Zipper face down</text>
    <path class="dg-arrow" d="M162 84 H186"></path>
    <text x="198" y="24">After</text>
    <path class="dg-xs-canvas" d="M198 84 H300 Q308 84 308 92 Q308 100 300 100 H288"></path>
    <path class="dg-xs-tape" d="M308 84 H338"></path>
    <rect class="dg-xs-teeth" x="324" y="76" width="10" height="8" rx="2"></rect>
    <text x="220" y="56">Zipper faces up</text>
    <path class="dg-line" d="M312 104 L306 122"></path>
    <text class="dg-strong" x="258" y="136">Crease</text>
  </svg>
</figure>

<figure class="step-fig" data-step="12">
  <svg viewBox="0 0 320 214" role="img" aria-label="Top view: the canvas on the left, the zipper on the right, stitching running along the canvas edge.">
    <rect class="dg-canvas" x="20" y="16" width="170" height="164"></rect>
    <rect class="dg-tape" x="190" y="16" width="64" height="164"></rect>
    <line class="dg-teeth" x1="222" y1="16" x2="222" y2="180"></line>
    <path class="dg-edge" d="M190 16 V180"></path>
    <path class="dg-stitch" d="M178 18 V98"></path>
    <rect class="dg-foot" x="156" y="70" width="44" height="72" rx="10"></rect>
    <circle class="dg-needle" cx="178" cy="104" r="3.5"></circle>
    <text x="32" y="36">Canvas</text>
    <text x="222" y="200" text-anchor="middle">Zipper on the right</text>
  </svg>
</figure>

<figure class="step-fig" data-step="13">
  <svg viewBox="0 0 320 224" role="img" aria-label="The zipper, now sewn to the top edge, is folded down to the opposite short edge so the marks on the zipper meet the marks on that edge.">
    <rect class="dg-canvas" x="110" y="48" width="100" height="150"></rect>
    <rect class="dg-tape" x="94" y="28" width="132" height="20"></rect>
    <line class="dg-teeth" x1="124" y1="38" x2="202" y2="38"></line>
    <rect class="dg-pull" x="110" y="31" width="11" height="14" rx="2"></rect>
    <path class="dg-act" d="M122 22 V54 M202 22 V54"></path>
    <path class="dg-act" d="M122 184 V198 M202 184 V198"></path>
    <path class="dg-arrow" d="M232 38 C288 38 288 192 220 194"></path>
    <text class="dg-strong" x="160" y="116" text-anchor="middle">Line up</text>
    <text class="dg-strong" x="160" y="132" text-anchor="middle">your marks</text>
    <text x="160" y="216" text-anchor="middle">Opposite edge</text>
  </svg>
</figure>

<figure class="step-fig" data-step="14">
  <svg viewBox="0 0 320 216" role="img" aria-label="Top view of the machine: the fabric edge runs along the line marked 10, to the right of the needle.">
    <rect class="dg-plate" x="12" y="12" width="296" height="176" rx="10"></rect>
    <path class="dg-line" d="M232 22 V178 M260 22 V178"></path>
    <rect class="dg-canvas" x="12" y="12" width="192" height="176"></rect>
    <path class="dg-act" d="M204 12 V188"></path>
    <text class="dg-strong" x="212" y="176">10</text>
    <path class="dg-stitch" d="M120 14 V98"></path>
    <rect class="dg-foot" x="96" y="66" width="48" height="76" rx="10"></rect>
    <circle class="dg-needle" cx="120" cy="104" r="3.5"></circle>
    <path class="dg-line" d="M124 100 L154 58"></path>
    <text x="156" y="54">Needle</text>
    <text x="160" y="208" text-anchor="middle">Fabric edge on the 10 line</text>
  </svg>
</figure>

<figure class="step-fig" data-step="16">
  <svg viewBox="0 0 320 214" role="img" aria-label="Top view: the zipper on the left, the canvas on the right, stitching running along the canvas edge.">
    <rect class="dg-canvas" x="130" y="16" width="170" height="164"></rect>
    <rect class="dg-tape" x="66" y="16" width="64" height="164"></rect>
    <line class="dg-teeth" x1="98" y1="16" x2="98" y2="180"></line>
    <path class="dg-edge" d="M130 16 V180"></path>
    <path class="dg-stitch" d="M142 18 V98"></path>
    <rect class="dg-foot" x="120" y="70" width="44" height="72" rx="10"></rect>
    <circle class="dg-needle" cx="142" cy="104" r="3.5"></circle>
    <text x="288" y="36" text-anchor="end">Canvas</text>
    <text x="98" y="200" text-anchor="middle">Zipper on the left</text>
  </svg>
</figure>

<figure class="step-fig" data-step="17">
  <svg viewBox="0 0 320 132" role="img" aria-label="A zipper opened at least halfway: the pull sits in the middle, with the left half of the zipper open.">
    <path class="dg-tape" d="M160 44 L20 12 L20 34 L160 64 Z"></path>
    <path class="dg-tape" d="M160 64 L20 94 L20 116 L160 84 Z"></path>
    <rect class="dg-tape" x="160" y="44" width="140" height="40"></rect>
    <line class="dg-teeth" x1="160" y1="64" x2="292" y2="64"></line>
    <path class="dg-teeth" d="M158 60 L22 30 M158 68 L22 98"></path>
    <rect class="dg-pull" x="148" y="54" width="22" height="20" rx="4"></rect>
    <rect class="dg-pull" x="168" y="60" width="22" height="8" rx="4"></rect>
    <text class="dg-strong" x="230" y="112" text-anchor="middle">At least halfway open</text>
  </svg>
</figure>

<title>Canvas Pouch QR Sign</title>
<script>document.documentElement.setAttribute("data-direction", "bold"); document.documentElement.classList.add("theme-light");</script>
<!--SITE_CSS-->
<style>
/* A printable sign for the table. Always light: it gets printed, and a QR code needs dark on light. */
@page { size: letter; margin: 0.5in; }
body { margin: 0; font-family: var(--type--family-sans); color: var(--color--text); background: #ffffff; -webkit-font-smoothing: antialiased; }
.sign { box-sizing: border-box; min-height: 100vh; max-width: 7.5in; margin: 0 auto; padding: 0.6in 0.4in; display: grid; align-content: center; justify-items: center; gap: 0.22in; text-align: center; }
.sign_brand { font-family: var(--type--family-heading); font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.sign_eyebrow { font-family: var(--type--family-mono); font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color--text); padding-bottom: 6px; border-bottom: 3px solid var(--color--primary); }
.sign_title { margin: 0; font-family: var(--type--family-heading); font-size: 60px; font-weight: 800; line-height: 1.02; letter-spacing: -0.036em; text-wrap: balance; }
.sign_qr { width: 4.2in; max-width: 80vw; padding: 0.12in; border: 3px solid var(--color--text); border-radius: 6px; background: #ffffff; }
.sign_qr svg { display: block; width: 100%; height: auto; }
.sign_scan { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.sign_url { margin: 0; font-family: var(--type--family-mono); font-size: 17px; color: var(--color--text-mu); overflow-wrap: anywhere; }
.sign_then { margin: 0; font-size: 18px; color: var(--color--text); max-width: 34ch; }
.sign_print { margin-top: 0.1in; }
@media print {
  .sign { min-height: auto; padding: 0; }
  .sign_print { display: none; }
}
@media (max-width: 600px) {
  .sign_title { font-size: 40px; }
  .sign_scan { font-size: 21px; }
}
</style>

<main class="sign">
  <span class="sign_brand">Casabe</span>
  <span class="sign_eyebrow">Workshop</span>
  <h1 class="sign_title">Sew a canvas zip pouch</h1>
  <div class="sign_qr" role="img" aria-label="QR code that opens workshops.casabe.studio/canvas-pouch"><!--QR_SVG--></div>
  <p class="sign_scan">Scan with your phone camera</p>
  <p class="sign_url">workshops.casabe.studio/canvas-pouch</p>
  <p class="sign_then">Then add your name at the top of the page and follow the steps.</p>
  <button class="button is-primary sign_print" type="button" onclick="window.print()">Print this sign</button>
</main>
